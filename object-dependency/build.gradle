plugins {
    id 'java'
}

group = 'spring'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
    testImplementation 'org.springframework:spring-test:5.3.18'
    testImplementation 'org.assertj:assertj-core:3.23.1'
    implementation 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'org.springframework:spring-beans:6.0.21'
    implementation 'org.springframework:spring-context:6.0.21'
    implementation 'org.springframework:spring-jdbc:6.0.21'
    implementation 'com.mysql:mysql-connector-j:8.2.0'
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation 'javax.activation:activation:1.1.1'
    implementation 'org.springframework:spring-context-support:5.3.10'
    implementation 'org.springframework:spring-aop:5.3.26'
    implementation 'org.aspectj:aspectjrt:1.9.9.1' // 현재 최신 버전으로 변경하세요
    implementation 'org.aspectj:aspectjweaver:1.9.9.1' // 현재 최신 버전으로 변경하세요
    implementation 'com.sun.xml.bind:jaxb-ri:2.3.5'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.springframework:spring-oxm:5.3.20' // Spring OXM 모듈, 버전은 최신 안정 버전을 사용하세요.
    implementation 'javax.xml.bind:jaxb-api:2.3.1' // JAXB API
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1' // JAXB 런타임
}

test {
    useJUnitPlatform()
}